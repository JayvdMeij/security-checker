# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: site-check
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Proxy chain on onrender.com: Cloudflare (appends client IP) -> Render edge (appends
      # Cloudflare IP) -> internal load balancer (appends edge IP). Verified via /api/debug/client-ip.
      - key: NUXT_TRUSTED_PROXY_HOPS
        value: "3"
